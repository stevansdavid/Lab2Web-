    <!-- Header -->

    <!-- Navigasi -->
    <nav>
        <a href="index.html">Beranda</a>
        <a href="#biodata">Biodata</a>
        <a href="#form">Form</a>
    </nav>

    <main>

        <!-- Data Biodata -->
        <section id="biodata">
            <h2>Data Mahasiswa</h2>

            <table border="1">
                <tr>
                    <th>Data</th>
                    <th>Keterangan</th>
                </tr>

                <tr>
                    <td>NIM</td>
                    <td>312410106</td>

                <tr>
                    <td>Nama</td>

                    <td>Status</td>
                    <td>Bekerja & Mahasiswa</td>
                </tr>

                <tr>
                    <td>Email</td>

                <tr>

                    <td>Cikarang Utara, Perum Grand Cikarang City</td>

        <!-- Form Biodata -->
        <section id="form">
            <h2>Form Biodata</h2>

            <form>

                <label for="nama">Nama</label><br>
                <input
                    type="text"
                    id="nama"
                    name="nama"
                    required
                >

                <br><br>

                <label for="email">Email</label><br>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <br><br>

                <label for="prodi">Program Studi</label><br>

                <select
                    id="prodi"
                    name="prodi"
                    required
                >
                    <option value="">-- Pilih --</option>
                    <option value="ti">Teknik Informatika</option>
                    <option value="si">Sistem Informasi</option>
                </select>

                <br><br>

                <label for="alamat">Alamat</label><br>

                <textarea
                    id="alamat"
                    name="alamat"
                    required
                    rows="5"
                    cols="40"
                ></textarea>

                <br><br>

                <button type="submit">Simpan</button>
                <button type="reset">Reset</button>

            </form>
        </section>

    </main>
